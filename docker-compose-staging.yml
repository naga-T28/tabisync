version: '3.12'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: tabisync_staging
      POSTGRES_USER: nagat
      POSTGRES_PASSWORD: b5G9upUk
    volumes:
      - pgdata:/var/lib/postgresql/data

    networks:
      - staging_webnet

  staging_tabisync:
    container_name: staging_tabisync
    build:
      context: .
      dockerfile: ./containers/django/Dockerfile
    environment:
      - DJANGO_SETTINGS_MODULE=project_tabisync.settings
    env_file:
      - ../.env
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    command: sh -c "/usr/local/bin/entrypoint.sh"
    networks:
      - staging_webnet

volumes:
  pgdata:

networks:
  staging_webnet:
    driver: bridge