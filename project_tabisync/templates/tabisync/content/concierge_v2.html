<script>
document.addEventListener("DOMContentLoaded", function () {
  const messagesEl = document.getElementById("conciergeMessages");
  const formEl = document.getElementById("conciergeForm");
  const inputEl = document.getElementById("conciergeInput");
  const sendButtonEl = formEl.querySelector(".concierge-send-btn");
  const usageCountEl = document.getElementById("conciergeUsageCount");
  const usageUsedEl = document.getElementById("conciergeUsageUsed");
  const usageLimitEl = document.getElementById("conciergeUsageLimit");
  const itineraryStorageId = "{{ itinerary.pk }}";
  const storageKey = `tabisync_concierge_conversation_${itineraryStorageId}`;
  const historyKey = `tabisync_concierge_history_${itineraryStorageId}`;
  const legacyStorageKey = "tabisync_concierge_conversation_{{ itinerary.pk }}_{{ itinerary.token }}";
  const legacyHistoryKey = "tabisync_concierge_history_{{ itinerary.pk }}_{{ itinerary.token }}";
  const conciergeMessageMaxLength = 60;
  let conversationId = window.localStorage.getItem(storageKey) || (window.crypto?.randomUUID ? window.crypto.randomUUID() : String(Date.now()));
  let chatHistory = [];
  const pendingChangeSets = new Map();

  function updateUsageCount(data = {}) {
    if (!usageCountEl || !usageUsedEl || !usageLimitEl) return;

    const currentLimit = Number(usageCountEl.dataset.dailyLimit || usageLimitEl.textContent || 0);
    const dailyLimit = Number.isFinite(Number(data.daily_limit)) ? Number(data.daily_limit) : currentLimit;
    if (!Number.isFinite(dailyLimit) || dailyLimit <= 0) return;

    const remainingCount = Number(data.remaining_count);
    let usedCount = Number(usageCountEl.dataset.usedCount || usageUsedEl.textContent || 0);
    if (Number.isFinite(remainingCount)) {
      usedCount = dailyLimit - remainingCount;
    }

    usedCount = Math.max(0, Math.min(usedCount, dailyLimit));
    usageCountEl.dataset.usedCount = String(usedCount);
    usageCountEl.dataset.dailyLimit = String(dailyLimit);
    usageUsedEl.textContent = String(usedCount);
    usageLimitEl.textContent = String(dailyLimit);
  }

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function renderInlineMarkdown(text) {
    let html = escapeHtml(text);
    html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
    html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    html = html.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    // 絶対URL(https?://)または"/"始まりの同一オリジン相対パスのみ許可する。
    // javascript:等の危険なスキームや相対パス以外の記法にはマッチしない。
    html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|\/[^\s)]*)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return html;
  }

  function renderMarkdown(text) {
    const lines = String(text || "").replace(/\r\n/g, "\n").split("\n");
    const blocks = [];
    let listType = null;
    let listItems = [];
    let paragraphLines = [];

    function flushParagraph() {
      if (!paragraphLines.length) return;
      blocks.push(`<p>${paragraphLines.map((line) => renderInlineMarkdown(line)).join("<br>")}</p>`);
      paragraphLines = [];
    }

    function flushList() {
      if (!listType || !listItems.length) return;
      blocks.push(`<${listType}>${listItems.map((item) => `<li>${renderInlineMarkdown(item)}</li>`).join("")}</${listType}>`);
      listType = null;
      listItems = [];
    }

    for (const rawLine of lines) {
      const line = rawLine.trimEnd();
      const trimmed = line.trim();

      if (!trimmed) {
        flushParagraph();
        flushList();
        continue;
      }

      const headingMatch = trimmed.match(/^(#{1,3})\s+(.*)$/);
      if (headingMatch) {
        flushParagraph();
        flushList();
        const level = headingMatch[1].length;
        blocks.push(`<h${level + 2}>${renderInlineMarkdown(headingMatch[2])}</h${level + 2}>`);
        continue;
      }

      const unorderedMatch = trimmed.match(/^[-*]\s+(.*)$/);
      if (unorderedMatch) {
        flushParagraph();
        if (listType && listType !== "ul") flushList();
        listType = "ul";
        listItems.push(unorderedMatch[1]);
        continue;
      }

      const orderedMatch = trimmed.match(/^\d+\.\s+(.*)$/);
      if (orderedMatch) {
        flushParagraph();
        if (listType && listType !== "ol") flushList();
        listType = "ol";
        listItems.push(orderedMatch[1]);
        continue;
      }

      if (listType) flushList();
      paragraphLines.push(trimmed);
    }

    flushParagraph();
    flushList();

    return blocks.join("");
  }

  const googleMapsApiKey = "{{ google_maps_api_key|default:'' }}";
  let googleMapsLoadPromise = null;

  function ensureGoogleMapsLoaded() {
    if (window.google && window.google.maps) return Promise.resolve();
    if (!googleMapsApiKey) return Promise.reject(new Error("Google Maps未設定"));
    if (googleMapsLoadPromise) return googleMapsLoadPromise;

    googleMapsLoadPromise = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(googleMapsApiKey)}`;
      script.async = true;
      script.defer = true;
      script.onload = () => resolve();
      script.onerror = () => reject(new Error("Google Mapsの読み込みに失敗しました。"));
      document.head.appendChild(script);
    });
    return googleMapsLoadPromise;
  }

  function buildGoogleMapsSearchUrl(place) {
    const params = new URLSearchParams({ api: "1", query: place.name || "Google" });
    if (place.place_id) params.set("query_place_id", place.place_id);
    return `https://www.google.com/maps/search/?${params.toString()}`;
  }

  // 地図componentは常に「場所名+住所+外部リンク」のカード一覧をまず描画する(iframe不使用)。
  // 座標を持つ場所が1件以上あれば、Google Maps JS APIを遅延ロードしてマーカー描画を追加する。
  // ロード失敗時はカード一覧のみが残るグレースフルデグレードとする。
  function renderMapComponent(component) {
    const wrapper = document.createElement("div");
    wrapper.className = "concierge-ui-component concierge-ui-map";

    const title = document.createElement("p");
    title.className = "concierge-ui-map-title";
    title.textContent = component.title || "地図";
    wrapper.appendChild(title);

    const places = Array.isArray(component.places) ? component.places : [];
    if (!places.length) return wrapper;

    const list = document.createElement("ul");
    list.className = "concierge-ui-map-list";
    places.forEach((place) => {
      const item = document.createElement("li");
      item.className = "concierge-ui-map-item";

      const name = document.createElement("span");
      name.className = "concierge-ui-map-item-name";
      name.textContent = place.name || "";
      item.appendChild(name);

      if (place.address) {
        const address = document.createElement("span");
        address.className = "concierge-ui-map-item-address";
        address.textContent = place.address;
        item.appendChild(address);
      }

      const link = document.createElement("a");
      link.className = "concierge-ui-map-item-link";
      link.href = place.maps_url || buildGoogleMapsSearchUrl(place);
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "Google Mapsで開く";
      item.appendChild(link);

      list.appendChild(item);
    });
    wrapper.appendChild(list);

    const geoPlaces = places.filter((place) => Number.isFinite(place.lat) && Number.isFinite(place.lng));
    if (!geoPlaces.length) return wrapper;

    const mapId = `concierge-map-${Date.now()}-${Math.random().toString(16).slice(2)}`;
    const mapCanvas = document.createElement("div");
    mapCanvas.className = "concierge-ui-map-canvas";
    mapCanvas.id = mapId;
    mapCanvas.setAttribute("role", "img");
    mapCanvas.setAttribute("aria-label", `${component.title || "地図"}の地図表示`);
    wrapper.appendChild(mapCanvas);

    ensureGoogleMapsLoaded()
      .then(() => {
        const canvasEl = document.getElementById(mapId);
        if (!canvasEl) return;
        const map = new window.google.maps.Map(canvasEl, {
          center: { lat: geoPlaces[0].lat, lng: geoPlaces[0].lng },
          zoom: 12,
        });
        const bounds = new window.google.maps.LatLngBounds();
        geoPlaces.forEach((place) => {
          const position = { lat: place.lat, lng: place.lng };
          new window.google.maps.Marker({ position, map, title: place.name || "" });
          bounds.extend(position);
        });
        if (geoPlaces.length > 1) map.fitBounds(bounds);
      })
      .catch(() => {
        mapCanvas.remove();
      });

    return wrapper;
  }

  function renderUiComponents(container, components) {
    if (!Array.isArray(components)) return;
    components.slice(0, 3).forEach((component) => {
      if (!component || component.type !== "map") return;
      container.appendChild(renderMapComponent(component));
    });
  }

  function migrateLegacyHistory() {
    const legacyConversationId = window.sessionStorage.getItem(legacyStorageKey);
    const legacyHistory = window.sessionStorage.getItem(legacyHistoryKey);

    if (!window.localStorage.getItem(storageKey) && legacyConversationId) {
      window.localStorage.setItem(storageKey, legacyConversationId);
      conversationId = legacyConversationId;
    }

    if (!window.localStorage.getItem(historyKey) && legacyHistory) {
      window.localStorage.setItem(historyKey, legacyHistory);
    }
  }

  function addMessage(role, text, options = {}) {
    const article = document.createElement("article");
    article.className = `concierge-message is-${role}`;

    const label = document.createElement("p");
    label.className = "concierge-message-label";
    label.textContent = role === "assistant" ? "AIコンシェルジュ" : "あなた";

    const bubble = document.createElement("div");
    bubble.className = "concierge-message-bubble";
    if (options.markdown) {
      bubble.innerHTML = renderMarkdown(text);
    } else {
      bubble.textContent = text;
    }

    article.appendChild(label);
    article.appendChild(bubble);

    if (role === "assistant" && Array.isArray(options.uiComponents) && options.uiComponents.length) {
      renderUiComponents(article, options.uiComponents);
    }

    if (role === "assistant" && Array.isArray(options.editActions) && options.editActions.length) {
      const changeSetId = options.changeSetId || `changes-${Date.now()}-${Math.random().toString(16).slice(2)}`;
      pendingChangeSets.set(changeSetId, options.editActions);

      const applyBox = document.createElement("div");
      applyBox.className = "concierge-apply-box";
      applyBox.dataset.changeSetId = changeSetId;

      const summary = document.createElement("p");
      summary.className = "concierge-apply-summary";
      summary.textContent = `${options.editActions.length}件の変更候補があります。`;

      const button = document.createElement("button");
      button.type = "button";
      button.className = "concierge-apply-btn";
      button.dataset.changeSetId = changeSetId;
      button.innerHTML = '<i class="fa-solid fa-check"></i><span>変更を適用</span>';

      const status = document.createElement("p");
      status.className = "concierge-apply-status";
      status.setAttribute("aria-live", "polite");

      applyBox.appendChild(summary);
      applyBox.appendChild(button);
      applyBox.appendChild(status);
      article.appendChild(applyBox);
    }

    messagesEl.appendChild(article);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function persistHistory() {
    window.localStorage.setItem(storageKey, conversationId);
    window.localStorage.setItem(historyKey, JSON.stringify(chatHistory));
  }

  function restoreHistory() {
    try {
      const rawHistory = window.localStorage.getItem(historyKey);
      const parsed = JSON.parse(rawHistory || "[]");
      if (!Array.isArray(parsed) || !parsed.length) return false;
      chatHistory = parsed.filter((item) => item && (item.role === "user" || item.role === "assistant") && item.content);
      chatHistory.forEach((item) => addMessage(item.role, item.content, {
        markdown: item.role === "assistant",
        editActions: item.edit_actions || [],
        uiComponents: item.ui_components || [],
        changeSetId: item.change_set_id || "",
      }));
      return chatHistory.length > 0;
    } catch (error) {
      return false;
    }
  }

  function setSending(isSending) {
    sendButtonEl.disabled = isSending;
    inputEl.disabled = isSending;
    sendButtonEl.classList.toggle("is-sending", isSending);
  }

  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) {
      return parts.pop().split(";").shift();
    }
    return "";
  }

  async function submitPrompt(prompt) {
    const userText = String(prompt || "").trim();
    if (!userText) return;
    if (userText.length > conciergeMessageMaxLength) {
      addMessage("assistant", `メッセージは${conciergeMessageMaxLength}字以内で入力してください。`);
      return;
    }

    addMessage("user", userText);
    chatHistory.push({ role: "user", content: userText });
    persistHistory();
    inputEl.value = "";
    setSending(true);

    try {
      const response = await fetch("{% url 'tabisync:V2_concierge' pk=itinerary.pk token=itinerary.token %}", {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCookie("csrftoken"),
        },
        body: JSON.stringify({
          message: userText,
          conversation_id: conversationId,
          history: chatHistory.slice(0, -1),
        }),
      });

      const responseText = await response.text();
      let data = null;
      try {
        data = JSON.parse(responseText);
      } catch (parseError) {
        const contentType = response.headers.get("content-type") || "(unknown)";
        throw new Error(`サーバーがJSON以外を返しました (status=${response.status}, content-type=${contentType}): ${responseText.slice(0, 120)}`);
      }
      updateUsageCount(data);

      if (!response.ok || data.status === "error" || data.status === "limit_exceeded") {
        throw new Error(data.message || "AIコンシェルジュに接続できませんでした。");
      }

      if (data.conversation_id) {
        conversationId = data.conversation_id;
      }

      const assistantReply = data.reply || "返答を生成できませんでした。";
      const editActions = Array.isArray(data.edit_actions) ? data.edit_actions : [];
      const uiComponents = Array.isArray(data.ui_components) ? data.ui_components : [];
      const changeSetId = editActions.length ? `changes-${Date.now()}-${Math.random().toString(16).slice(2)}` : "";
      addMessage("assistant", assistantReply, {
        markdown: true,
        editActions,
        uiComponents,
        changeSetId,
      });
      chatHistory.push({
        role: "assistant",
        content: assistantReply,
        edit_actions: editActions,
        ui_components: uiComponents,
        change_set_id: changeSetId,
      });
      persistHistory();
    } catch (error) {
      const message = error instanceof Error ? error.message : "エラーが発生しました。";
      addMessage("assistant", message);
      chatHistory.push({ role: "assistant", content: message });
      persistHistory();
    } finally {
      setSending(false);
    }
  }

  formEl.addEventListener("submit", function (event) {
    event.preventDefault();
    submitPrompt(inputEl.value);
  });

  messagesEl.addEventListener("click", async function (event) {
    const button = event.target instanceof Element ? event.target.closest(".concierge-apply-btn") : null;
    if (!button) return;

    const changeSetId = button.dataset.changeSetId || "";
    const editActions = pendingChangeSets.get(changeSetId);
    const applyBox = button.closest(".concierge-apply-box");
    const statusEl = applyBox ? applyBox.querySelector(".concierge-apply-status") : null;
    if (!Array.isArray(editActions) || !editActions.length) {
      if (statusEl) statusEl.textContent = "適用できる変更が見つかりませんでした。";
      return;
    }

    button.disabled = true;
    button.classList.add("is-applying");
    if (statusEl) statusEl.textContent = "変更を適用しています...";

    try {
      const response = await fetch("{% url 'tabisync:V2_concierge_apply' pk=itinerary.pk token=itinerary.token %}", {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": getCookie("csrftoken"),
        },
        body: JSON.stringify({ edit_actions: editActions }),
      });
      const responseText = await response.text();
      let data = null;
      try {
        data = JSON.parse(responseText);
      } catch (parseError) {
        throw new Error("サーバーからJSON以外の応答が返りました。");
      }
      if (!response.ok || data.status !== "ok") {
        throw new Error(data.message || "変更を適用できませんでした。");
      }

      button.classList.remove("is-applying");
      button.classList.add("is-applied");
      button.innerHTML = '<i class="fa-solid fa-circle-check"></i><span>適用済み</span>';
      if (statusEl) statusEl.textContent = `${data.applied_count || editActions.length}件の変更を適用しました。`;
      pendingChangeSets.delete(changeSetId);

      chatHistory = chatHistory.map((item) => (
        item.change_set_id === changeSetId
          ? { ...item, edit_actions: [], applied: true }
          : item
      ));
      persistHistory();
    } catch (error) {
      button.disabled = false;
      button.classList.remove("is-applying");
      if (statusEl) statusEl.textContent = error instanceof Error ? error.message : "変更を適用できませんでした。";
    }
  });

  window.tabisyncConciergePing = function () {
    return submitPrompt("__ping__");
  };

  migrateLegacyHistory();

  if (!restoreHistory()) {
    const termsUrl = "{% url 'tabisync:concierge_terms' %}";
    const welcomeMessage = `旅程表、行きたいところ、持ち物、メモを必要に応じて読み分けながら案内します。[利用規約と注意事項](${termsUrl})を必ずお読みの上、ご利用ください。\n質問例：「Day2の予定を教えて」「おすすめの場所ある？」「空いている日はある？」「持ち物を考えて」`;
    addMessage("assistant", welcomeMessage, { markdown: true });
    chatHistory.push({
      role: "assistant",
      content: welcomeMessage,
    });
    persistHistory();
  }
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  function startConciergeTour(forceStart) {
    if (!window.driver || !window.driver.js || !window.driver.js.driver) return;

    const tourStorageKey = "tabisync_concierge_tour_seen";
    if (!forceStart && window.localStorage.getItem(tourStorageKey)) return;

    const isPc = window.matchMedia("(min-width: 960px)").matches;
    const tourSteps = [
      {
        popover: {
          title: 'AIコンシェルジュへようこそ',
          description: '入力した内容に基づいて、旅程表と行きたい場所をもとに答えてくれるあなた専用のAIコンシェルジュです。'
        }
      },
      ...(isPc ? [
        {
          element: '.content-side-nav',
          popover: {
            title: 'メニュー',
            description: '左側のメニューから、旅程表・メモ・リスト・地図などへ移動できます。'
          }
        }
      ] : []),
      {
        element: '#conciergeMessages',
        popover: {
          title: 'チャット',
          description: 'AIコンシェルジュとの会話がここに表示されます。'
        }
      },
      {
        element: '.concierge-input-dock',
        popover: {
          title: '質問入力',
          description: '質問を入力して送信すると、旅の情報をもとに回答します。'
        }
      },
      ...(!isPc ? [
        {
          element: '#content-tour-button',
          popover: {
            title: 'ヘルプ',
            description: 'この説明はヘルプアイコンから再度見ることができます。'
          }
        }
      ] : []),      
      ...(!isPc ? [
        {
          element: '#back-home',
          popover: {
            title: 'ホーム',
            description: 'このボタンをクリックすると旅程表に戻れます。'
          }
        }
      ] : []),
      {
        popover: {
          title: '早速初めてみましょう！',
          description: '例えば「1日目の予定を立てて」「この旅行で必要なものを持ち物リストに追加して」などと自由に尋ねてみてください。'
        }
      },
    ];

    const driverObj = window.driver.js.driver({
      animate: true,
      overlayOpacity: 0.75,
      showProgress: true,
      nextBtnText: '次へ',
      prevBtnText: '戻る',
      doneBtnText: '完了',
      onDestroyed: function () {
        window.localStorage.setItem(tourStorageKey, "true");
      },
      steps: tourSteps
    });

    driverObj.drive();
  }

  window.startContentTour = function () {
    startConciergeTour(true);
  };

  startConciergeTour(false);

  const tourButton = document.getElementById("content-tour-button");
  if (tourButton) {
    tourButton.addEventListener("click", function () {
      startConciergeTour(true);
    });
  }
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const toggle = document.querySelector(".content-side-nav-toggle");
  const storageKey = "tabisync_content_side_nav_collapsed";
  const collapsedClass = "is-side-nav-collapsed";

  function applySideNavState(isCollapsed) {
    document.body.classList.toggle(collapsedClass, isCollapsed);
    if (!toggle) return;

    toggle.setAttribute("aria-expanded", isCollapsed ? "false" : "true");
    toggle.setAttribute("aria-label", isCollapsed ? "サイドバーを開く" : "サイドバーを折りたたむ");

    const icon = toggle.querySelector("i");
    if (icon) {
      icon.className = isCollapsed ? "fa-solid fa-angle-right" : "fa-solid fa-angle-left";
    }
  }

  applySideNavState(window.localStorage.getItem(storageKey) === "true");

  if (toggle) {
    toggle.addEventListener("click", function () {
      const nextState = !document.body.classList.contains(collapsedClass);
      window.localStorage.setItem(storageKey, String(nextState));
      applySideNavState(nextState);
    });
  }

  try {
    const recentKey = "tabisync_recent_itineraries";
    const recent = JSON.parse(window.localStorage.getItem(recentKey) || "[]");
    const current = {
      id: "{{ itinerary.pk|escapejs }}",
      title: "{{ itinerary.title|escapejs }}",
      url: "{% url 'tabisync:content_v2' pk=itinerary.pk token=itinerary.token %}",
      viewedAt: Date.now()
    };
    const nextRecent = [
      current,
      ...recent.filter(function (item) {
        return item && item.id !== current.id && item.url !== current.url;
      })
    ].slice(0, 6);

    window.localStorage.setItem(recentKey, JSON.stringify(nextRecent));
  } catch (error) {
    // localStorageが使えない環境では履歴表示を省略します。
  }
});
</script>
