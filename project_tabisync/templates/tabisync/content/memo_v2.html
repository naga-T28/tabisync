{% extends "tabisync/content/base.html" %}
{% load static %}
{% block title %}しおり作成画面{% endblock %}

{% block contents %}
<div class="memo-v2-wrapper">
    <div id="memo-display">
        {{ memo.content|safe }}
    </div>

    <div id="memo-editor" style="display:none;">
        <form id="memo-form">
            {{ form.media }}
            {{ form.content }}
        </form>
        <div id="save-status"></div>
    </div>

    <button id="edit-btn">編集</button>
    <button id="done-btn" style="display:none;">完了</button>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const editBtn = document.getElementById("edit-btn");
    const doneBtn = document.getElementById("done-btn");
    const display = document.getElementById("memo-display");
    const editorDiv = document.getElementById("memo-editor");

    const textarea = document.getElementById("id_content");
    if (!textarea) return;

    let timeout;

    textarea.addEventListener("input", function() {
        clearTimeout(timeout);
        timeout = setTimeout(() => {
            fetch(window.location.href, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": document.querySelector('[name=csrfmiddlewaretoken]').value
                },
                body: JSON.stringify({
                    content: textarea.value
                })
            }).then(res => res.json()).then(data => {
                document.getElementById("save-status").innerText = "保存済み";
            });
        }, 1000);
    });

    editBtn.onclick = () => {
        display.style.display = "none";
        editorDiv.style.display = "block";
        editBtn.style.display = "none";
        doneBtn.style.display = "inline-block";
    };

    doneBtn.onclick = () => {
        display.innerHTML = textarea.value;
        display.style.display = "block";
        editorDiv.style.display = "none";
        editBtn.style.display = "inline-block";
        doneBtn.style.display = "none";
    };
});
</script>
{% endblock %}
