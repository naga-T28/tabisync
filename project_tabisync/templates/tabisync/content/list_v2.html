{% extends "tabisync/content/base.html" %}
{% block title %}リスト{% endblock %}

{% block contents %}
<div class="content-main">
  <div class="checklist-view-page">

    <div class="title-wrapper">
      <div class="title-visual --miniMargin">
        <p class="siori-sub-title">{{ itinerary.title }}</p>
        <h1 class="siori-title --noMargin">チェックリスト</h1>
      </div>
    </div>
    <section id="checklistBoard" class="checklist-board"></section>
  </div>
</div>

<script id="checklists-data" type="application/json">{{ checklists_json|safe }}</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const board = document.getElementById("checklistBoard");
  const dataEl = document.getElementById("checklists-data");
  let lists = [];

  try {
    lists = JSON.parse(dataEl.textContent || "[]");
  } catch (error) {
    lists = [];
  }

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function renderBoard() {
    if (!board) return;

    if (!lists.length) {
      board.innerHTML = `
        <div class="checklist-empty">
          <p>まだリストがありません。</p>
          <p>編集ページから追加できます。</p>
        </div>
      `;
      return;
    }

    board.innerHTML = lists.map((list, listIndex) => `
      <article class="checklist-card" data-list-id="${list.id}">
        <div class="box5-6 checklist-box">
          <h3 class="checklist-tape checklist-tape-${listIndex % 4}">${escapeHtml(list.title || "リスト")}</h3>
          <div class="box-content">
            ${(list.items || []).length ? `
              <ul class="checklist-items">
                ${(list.items || []).map((item) => `
                  <li class="checklist-item">
                    <label class="checklist-label">
                      <input type="checkbox" ${item.checked ? "checked" : ""} disabled>
                      <span>${escapeHtml(item.text || "")}</span>
                    </label>
                  </li>
                `).join("")}
              </ul>
            ` : `
              <p class="checklist-empty-text">このリストにはまだ項目がありません。</p>
            `}
          </div>
        </div>
      </article>
    `).join("");
  }

  renderBoard();
});
</script>

{% endblock %}
