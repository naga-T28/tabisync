{% extends "tabisync/content/base.html" %}
{% block title %}リスト編集{% endblock %}

{% block contents %}
<div class="content-main">
  <div class="checklist-page checklist-edit-page">
    <section class="checklist-header">
      <div>
        <h2>チェックリスト編集</h2>
        <p>複数のリストを作成して、名前や項目を自由に編集できます。</p>
      </div>
      <a class="checklist-edit-link" href="{% url 'tabisync:V2_list' pk=itinerary.pk token=itinerary.token %}">
        <i class="fa-solid fa-eye"></i>
        表示ページへ
      </a>
    </section>

    <p id="checklist-status" class="checklist-status" data-status="idle">
      <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
      <span>編集内容は自動保存されます</span>
    </p>

    <section id="checklistEditor" class="checklist-board"></section>
  </div>
</div>

<script id="checklists-data" type="application/json">{{ checklists_json|safe }}</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const editor = document.getElementById("checklistEditor");
  const statusEl = document.getElementById("checklist-status");
  const dataEl = document.getElementById("checklists-data");
  const csrfToken = getCookie("csrftoken");
  let saveTimer = null;
  let lists = [];
  let activeListId = "";

  try {
    lists = JSON.parse(dataEl.textContent || "[]");
  } catch (error) {
    lists = [];
  }
  activeListId = lists[0]?.id || "";

  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(";").shift();
    return "";
  }

  function createId(prefix) {
    return `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2, 8)}`;
  }

  function setStatus(status, text) {
    if (!statusEl) return;

    const iconMap = {
      idle: "fa-circle-info",
      saving: "fa-rotate fa-spin",
      saved: "fa-circle-check",
      error: "fa-circle-exclamation",
      dirty: "fa-pen",
    };

    statusEl.dataset.status = status;
    statusEl.querySelector("span").textContent = text;
    statusEl.querySelector("i").className = `fa-solid ${iconMap[status] || iconMap.idle}`;
  }

  function createEmptyList() {
    return {
      id: createId("list"),
      title: "",
      items: [],
    };
  }

  function createEmptyItem() {
    return {
      id: createId("item"),
      text: "",
      checked: false,
    };
  }

  function renderEditor() {
    if (!lists.length) {
      editor.innerHTML = `
        <div class="checklist-empty">
          <p>まだリストがありません。</p>
          <button type="button" class="checklist-tab-add" data-action="add-list" aria-label="リストを追加">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>
      `;
      return;
    }

    const activeList = getActiveList();
    const activeIndex = Math.max(lists.findIndex((list) => list.id === activeList.id), 0);

    editor.innerHTML = `
      <nav class="checklist-tabs" aria-label="編集するチェックリストを切り替え">
        ${lists.map((list) => `
          <button
            type="button"
            class="checklist-tab ${list.id === activeList.id ? "is-active" : ""}"
            data-action="select-list"
            data-list-id="${list.id}"
          >
            ${escapeHtml(list.title || "リスト")}
          </button>
        `).join("")}
        <button type="button" class="checklist-tab-add" data-action="add-list" aria-label="リストを追加">
          <i class="fa-solid fa-plus"></i>
        </button>
      </nav>
      <article class="box5-6 checklist-box checklist-edit-box" data-list-id="${activeList.id}">
        <h3 class="checklist-tape checklist-tape-${activeIndex % 4}">${escapeHtml(activeList.title || "リスト")}</h3>
        <div class="checklist-edit-head">
          <input
            type="text"
            class="checklist-title-input"
            data-action="title"
            data-list-id="${activeList.id}"
            value="${escapeHtml(activeList.title || "")}"
            placeholder="リスト名を入力"
          >
          <button type="button" class="checklist-delete-list" data-action="delete-list" data-list-id="${activeList.id}" aria-label="リストを削除する">
            <i class="fa-solid fa-trash"></i>
          </button>
        </div>
        <div class="box-content">
          <ul class="checklist-edit-items">
            ${(activeList.items || []).map((item) => `
              <li class="checklist-edit-item">
                <label class="checklist-item-check">
                  <input
                    type="checkbox"
                    data-action="toggle-item"
                    data-list-id="${activeList.id}"
                    data-item-id="${item.id}"
                    ${item.checked ? "checked" : ""}
                  >
                </label>
                <input
                  type="text"
                  class="checklist-item-input"
                  data-action="item-text"
                  data-list-id="${activeList.id}"
                  data-item-id="${item.id}"
                  value="${escapeHtml(item.text || "")}"
                  placeholder="項目を入力"
                >
                <button type="button" class="checklist-delete-item" data-action="delete-item" data-list-id="${activeList.id}" data-item-id="${item.id}" aria-label="項目を削除する">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </li>
            `).join("")}
          </ul>
          <button type="button" class="checklist-add-item" data-action="add-item" data-list-id="${activeList.id}">
            <i class="fa-solid fa-plus"></i>
            項目を追加
          </button>
        </div>
      </article>
    `;
  }

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function buildSanitizedLists() {
    return lists
      .map((list) => ({
        id: list.id || createId("list"),
        title: String(list.title || "").trim(),
        items: Array.isArray(list.items)
          ? list.items
              .map((item) => ({
                id: item.id || createId("item"),
                text: String(item.text || "").trim(),
                checked: Boolean(item.checked),
              }))
              .filter((item) => item.text)
          : [],
      }))
      .filter((list) => list.title || list.items.length);
  }

  function getActiveList() {
    return lists.find((list) => list.id === activeListId) || lists[0] || null;
  }

  function addList() {
    const newList = createEmptyList();
    lists.push(newList);
    activeListId = newList.id;
    renderEditor();
    setStatus("dirty", "未保存の変更があります");

    const input = editor.querySelector(`.checklist-title-input[data-list-id="${newList.id}"]`);
    if (input) {
      input.focus();
    }
  }

  async function saveLists() {
    const payloadLists = buildSanitizedLists();
    setStatus("saving", "保存中...");

    try {
      const response = await fetch(window.location.href, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-CSRFToken": csrfToken,
        },
        credentials: "same-origin",
        body: JSON.stringify({ lists: payloadLists }),
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      await response.json();
      setStatus("saved", "保存済み");
    } catch (error) {
      console.error(error);
      setStatus("error", "保存に失敗しました");
    }
  }

  function queueSave() {
    setStatus("dirty", "未保存の変更があります");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveLists, 500);
  }

  editor.addEventListener("input", function (event) {
    const target = event.target;

    if (target.dataset.action === "title") {
      const list = lists.find((entry) => entry.id === target.dataset.listId);
      if (!list) return;
      list.title = target.value;
      queueSave();
      return;
    }

    if (target.dataset.action === "item-text") {
      const list = lists.find((entry) => entry.id === target.dataset.listId);
      if (!list) return;

      const item = (list.items || []).find((entry) => entry.id === target.dataset.itemId);
      if (!item) return;

      item.text = target.value;
      queueSave();
    }
  });

  editor.addEventListener("change", function (event) {
    const target = event.target;
    if (target.dataset.action !== "toggle-item") return;

    const list = lists.find((entry) => entry.id === target.dataset.listId);
    if (!list) return;

    const item = (list.items || []).find((entry) => entry.id === target.dataset.itemId);
    if (!item) return;

    item.checked = target.checked;
    queueSave();
  });

  editor.addEventListener("click", function (event) {
    const actionButton = event.target.closest("[data-action]");
    if (!actionButton) return;

    const { action, listId, itemId } = actionButton.dataset;
    const list = lists.find((entry) => entry.id === listId);

    if (action === "select-list") {
      activeListId = listId || activeListId;
      renderEditor();
      return;
    }

    if (action === "add-list") {
      addList();
      return;
    }

    if (action === "add-item") {
      if (!list) return;
      list.items = list.items || [];
      const newItem = createEmptyItem();
      list.items.push(newItem);
      renderEditor();
      setStatus("dirty", "未保存の変更があります");

      const input = editor.querySelector(`.checklist-item-input[data-item-id="${newItem.id}"]`);
      if (input) {
        input.focus();
      }
      return;
    }

    if (action === "delete-item") {
      if (!list) return;
      list.items = (list.items || []).filter((entry) => entry.id !== itemId);
      renderEditor();
      queueSave();
      return;
    }

    if (action === "delete-list") {
      lists = lists.filter((entry) => entry.id !== listId);
      activeListId = lists[0]?.id || "";
      renderEditor();
      queueSave();
    }
  });

  renderEditor();
});
</script>

{% endblock %}
