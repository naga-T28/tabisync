{% load static %}
<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>{{ itinerary.title }} | TabiSync</title>
        <!-- インデックス防止用-->
        <meta name="robots" content="noindex, nofollow">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Font Awesome CDN (最新版) -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <!-- ファビコン -->
        <link rel="icon" href="{% static 'img/icon-tabisync.webp'%}">
        <link rel="apple-touch-icon" href="{% static 'img/icon-tabisync.webp'%}">
        <!-- iPhone用のアイコンサイズを指定 -->
        <meta name="apple-mobile-web-app-title" content="TabiSync">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <!---Googleフォント-->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
        <!-- OGP設定 -->
        <meta property="og:title" content="{{ itinerary.title }} | TabiSync">
        <meta property="og:description" content="旅のしおりをみんなで簡単共有！">
        <meta property="og:image" content="{{ request.build_absolute_uri|cut:request.get_full_path }}{% static 'img/tabisync-ogp.webp' %}">
        <meta property="og:url" content="{{ request.build_absolute_uri }}">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="TabiSync">
        <!-- Twitterカード（任意）-->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="{{ itinerary.title }} | TabiSync">
        <meta name="twitter:description" content="旅のしおりをみんなで簡単共有！">
        <meta name="twitter:image" content="{{ request.build_absolute_uri|cut:request.get_full_path }}{% static 'img/tabisync-ogp.webp' %}">
        <!---リセットcsss-->
        <link rel="stylesheet" href="{% static 'css/reset.css'%}">
        <!--オリジナルCSS-->
        <link rel="stylesheet" href="{% static 'css/style_v2_1.css'%}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">    
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    </head>
    <body id="content-body">
        <header class="page-header">
            <div class="header-wrapper">
                <div class="header-logo">
                    <h1>
                        <a href="{% url 'tabisync:home' %}">
                            <img src="{% static 'img/logo-tabisync.webp' %}" alt="TabiSyncロゴ" class="logo-image">
                        </a>
                    </h1>
                </div>
                <!-- ハンバーガーアイコン -->
                <div class="header-buttons">
                    <button id="share-button" onclick="location.reload();"><i class="fa-solid fa-sync"></i>更新</button>
                    <a href="{% url 'tabisync:content_edit_v2' pk=itinerary.pk token=itinerary.token %}" id="share-button"><i class="fa-solid fa-pen-to-square"></i>編集</a>
                </div>
            </div>
        </header>
        {% block contents %}

        {% endblock %}
        <footer>
            <nav class="footer-nav">
                <ul class="footer-nav-ul">
                    <li class="footer-nav-li {% if request.resolver_match.url_name == 'content_v2' %}footer-nav-li-select{% endif %}">
                        <a class="footer-nav-a" href="{% url 'tabisync:content_v2' pk=itinerary.pk token=itinerary.token %}">
                            <i class="fa-solid fa-house"></i>
                            <div>旅程表</div>
                        </a>
                    </li>
                    <li class="footer-nav-li {% if request.resolver_match.url_name == 'Wantto' %}footer-nav-li-select{% endif %}">
                        <a class="footer-nav-a" href="{% url 'tabisync:Wantto' pk=itinerary.pk token=itinerary.token %}">
                            <i class="fa-solid fa-map-location-dot"></i>
                            <div>地図</div>
                        </a>
                    </li>
                    <li class="footer-nav-li {% if request.resolver_match.url_name == 'V2_list' or request.resolver_match.url_name == 'V2_list_edit' %}footer-nav-li-select{% endif %}">
                        <a class="footer-nav-a" href="{% url 'tabisync:V2_list' pk=itinerary.pk token=itinerary.token %}">
                            <i class="fa-solid fa-list-check"></i>
                            <div>リスト</div>
                        </a>
                    </li>
                    <li class="footer-nav-li {% if request.resolver_match.url_name == 'V2_memo' %}footer-nav-li-select{% endif %}">
                        <a class="footer-nav-a" href="{% url 'tabisync:V2_memo' pk=itinerary.pk token=itinerary.token %}">
                            <i class="fa-solid fa-clipboard"></i>
                            <div>メモ</div>
                        </a>
                    </li>
                    <!---
                    <li class="footer-nav-li {% if request.resolver_match.url_name == 'edit' %}footer-nav-li-select{% endif %}">
                        <a class="footer-nav-a" href="{% url 'tabisync:edit' pk=itinerary.pk token=itinerary.token %}">
                            <i class="fa-solid fa-wallet"></i>
                            <div>割り勘</div>
                        </a>
                    </li>
                    <li class="footer-nav-li {% if request.resolver_match.url_name == 'edit' %}footer-nav-li-select{% endif %}">
                        <a class="footer-nav-a" href="{% url 'tabisync:edit' pk=itinerary.pk token=itinerary.token %}">
                            <i class="fa-solid fa-robot"></i>
                            <div>AI提案</div>
                        </a>
                    </li>
                    -->
                </ul>
            </nav>
            <ul>
                <li><a class="footer-content" href="{% url 'tabisync:user_agreement' %}">利用規約</a></li>
                <li><a class="footer-content" href="{% url 'tabisync:privacy_policy' %}">プライバシーポリシー</a></li>
                <li><a class="footer-content" href="{% url 'tabisync:profile' %}">運営者プロフィール</a></li>
            </ul>
            <small>Copyright &copy; 2024-2026 TabiSync All Rights Reserved.</small>
        </footer>
    </body>
</html>
