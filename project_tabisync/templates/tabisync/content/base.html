{% load static %}
<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>{{ itinerary.title }} | TabiSync</title>
        <!-- インデックス防止用-->
        <meta name="robots" content="noindex, nofollow">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Font Awesome CDN (最新版) -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
        <!-- ファビコン -->
        <link rel="icon" href="{% static 'img/icon-pc.webp'%}">
        <link rel="apple-touch-icon" href="{% static 'img/tabisync-ios-icon.ico'%}">
        <!-- iPhone用のアイコンサイズを指定 -->
        <meta name="apple-mobile-web-app-title" content="TabiSync">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <!---Googleフォント-->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
        <!-- OGP設定 -->
        <meta property="og:title" content="{{ itinerary.title }} | TabiSync">
        <meta property="og:description" content="旅のしおりをみんなで簡単共有！">
        <meta property="og:image" content="{{ request.build_absolute_uri|cut:request.get_full_path }}{% static 'img/tabisync-ogp.webp' %}">
        <meta property="og:url" content="{{ request.build_absolute_uri }}">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="TabiSync">
        <!-- Twitterカード（任意）-->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="{{ itinerary.title }} | TabiSync">
        <meta name="twitter:description" content="旅のしおりをみんなで簡単共有！">
        <meta name="twitter:image" content="{{ request.build_absolute_uri|cut:request.get_full_path }}{% static 'img/tabisync-ogp.webp' %}">
        <!---リセットcsss-->
        <link rel="stylesheet" href="{% static 'css/reset.css'%}">
        <!--オリジナルCSS-->
        <link rel="stylesheet" href="{% static 'css/style_v2_1.css'%}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">    
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    </head>
    <body id="content-body">
        <header class="page-header --only-pc content-side-nav">
            <div class="content-side-nav-inner">
                <div class="content-side-nav-logo">
                    <a href="{% url 'tabisync:home' %}">
                        <img src="{% static 'img/tabisync-icon-pc.webp' %}" alt="TabiSyncロゴ" class="logo-image content-side-nav-logo-expanded">
                        <img src="{% static 'img/icon-pc.webp' %}" alt="TabiSyncロゴ" class="logo-image content-side-nav-logo-collapsed">
                    </a>
                </div>
                <nav class="content-side-nav-menu" aria-label="しおりメニュー">
                    <a class="content-side-nav-link {% if request.resolver_match.url_name == 'content_v2' %}is-active{% endif %}" href="{% url 'tabisync:content_v2' pk=itinerary.pk token=itinerary.token %}">
                        <i class="fa-solid fa-house content-side-nav-icon"></i>
                        <span class="content-side-nav-label">旅程表</span>
                        <i class="fa-solid fa-chevron-right content-side-nav-chevron"></i>
                    </a>
                    <a class="content-side-nav-link {% if request.resolver_match.url_name == 'V2_memo' or request.resolver_match.url_name == 'V2_memo_edit' %}is-active{% endif %}" href="{% url 'tabisync:V2_memo' pk=itinerary.pk token=itinerary.token %}">
                        <i class="fa-solid fa-clipboard content-side-nav-icon"></i>
                        <span class="content-side-nav-label">メモ</span>
                        <i class="fa-solid fa-chevron-right content-side-nav-chevron"></i>
                    </a>
                    <a class="content-side-nav-link {% if request.resolver_match.url_name == 'V2_list' or request.resolver_match.url_name == 'V2_list_edit' %}is-active{% endif %}" href="{% url 'tabisync:V2_list' pk=itinerary.pk token=itinerary.token %}">
                        <i class="fa-solid fa-list-check content-side-nav-icon"></i>
                        <span class="content-side-nav-label">リスト</span>
                        <i class="fa-solid fa-chevron-right content-side-nav-chevron"></i>
                    </a>
                    <a class="content-side-nav-link {% if request.resolver_match.url_name == 'Wantto' %}is-active{% endif %}" href="{% url 'tabisync:Wantto' pk=itinerary.pk token=itinerary.token %}">
                        <i class="fa-solid fa-map-location-dot content-side-nav-icon"></i>
                        <span class="content-side-nav-label">地図</span>
                        <i class="fa-solid fa-chevron-right content-side-nav-chevron"></i>
                    </a>
                    <a class="content-side-nav-link {% if request.resolver_match.url_name == 'V2_concierge' %}is-active{% endif %}" href="{% url 'tabisync:V2_concierge' pk=itinerary.pk token=itinerary.token %}">
                        <i class="fa-solid fa-robot content-side-nav-icon"></i>
                        <span class="content-side-nav-label">AIコンシェルジュ</span>
                        <i class="fa-solid fa-chevron-right content-side-nav-chevron"></i>
                    </a>
                    <a class="content-side-nav-link {% if request.resolver_match.url_name == 'content_edit_v2' %}is-active{% endif %}" href="{% url 'tabisync:content_edit_v2' pk=itinerary.pk token=itinerary.token %}">
                        <i class="fa-regular fa-pen-to-square content-side-nav-icon"></i>
                        <span class="content-side-nav-label">編集</span>
                        <i class="fa-solid fa-chevron-right content-side-nav-chevron"></i>
                    </a>
                </nav>
                <div class="content-side-nav-bottom">
                    <nav class="content-side-nav-legal" aria-label="サイト情報">
                        <a href="{% url 'tabisync:profile' %}" target="_blank">
                            <i class="fa-regular fa-user content-side-nav-legal-icon"></i>
                            <span class="content-side-nav-label">運営者について</span>
                        </a>
                        <a href="{% url 'tabisync:privacy_policy' %}" target="_blank">
                            <i class="fa-solid fa-shield-halved content-side-nav-legal-icon"></i>
                            <span class="content-side-nav-label">プライバシーポリシー</span>
                        </a>
                        <a href="{% url 'tabisync:user_agreement' %}" target="_blank">
                            <i class="fa-regular fa-file-lines content-side-nav-legal-icon"></i>
                            <span class="content-side-nav-label">利用規約</span>
                        </a>
                    </nav>
                    <button type="button" class="content-side-nav-toggle" aria-label="サイドバーを折りたたむ" aria-expanded="true">
                        <i class="fa-solid fa-angle-left"></i>
                    </button>
                </div>
            </div>
        </header>
        <header class="page-header --only-sp">
            <div class="header-wrapper">
                <div class="header-buttons">
                    <button id="share-button" onclick="location.reload();"><i class="fa-solid fa-sync"></i></button>
                </div>
                <div class="header-logo">
                    <h1>
                        <a href="{% url 'tabisync:home' %}">
                            <img src="{% static 'img/tabisync-icon-pc.webp' %}" alt="TabiSyncロゴ" class="logo-image">
                        </a>
                    </h1>
                </div>
                <!-- ハンバーガーアイコン -->
                <div class="header-buttons">
                    <a href="{% url 'tabisync:V2_concierge' pk=itinerary.pk token=itinerary.token %}" id="share-button"><img src="{% static 'img/ai-concierge-icon.webp' %}" alt="AIコンシェルジュ" class="footer-nav-icon-ai-concierge"></a>
                </div>
            </div>
        </header>
        {% block contents %}

        {% endblock %}
        <footer>
            <nav class="footer-nav  --only-sp">
                <ul class="footer-nav-ul">
                    <li class="footer-nav-li {% if request.resolver_match.url_name == 'content_v2' %}footer-nav-li-select{% endif %}">
                        <a class="footer-nav-a" href="{% url 'tabisync:content_v2' pk=itinerary.pk token=itinerary.token %}">
                            <i class="fa-solid fa-house"></i>
                            <!--<div>旅程表</div>-->
                        </a>
                    </li>
                    <li class="footer-nav-li {% if request.resolver_match.url_name == 'V2_memo' or request.resolver_match.url_name == 'V2_memo_edit' %}footer-nav-li-select{% endif %}">
                        <a class="footer-nav-a" href="{% url 'tabisync:V2_memo' pk=itinerary.pk token=itinerary.token %}">
                            <i class="fa-solid fa-clipboard"></i>
                            <!--<div>メモ</div> -->
                        </a>
                    </li>
                    <li class="footer-nav-li {% if request.resolver_match.url_name == 'V2_list' or request.resolver_match.url_name == 'V2_list_edit' %}footer-nav-li-select{% endif %}">
                        <a class="footer-nav-a" href="{% url 'tabisync:V2_list' pk=itinerary.pk token=itinerary.token %}">
                            <i class="fa-solid fa-list-check"></i>
                            <!--<div>リスト</div>-->
                        </a>
                    </li>
                    <li class="footer-nav-li {% if request.resolver_match.url_name == 'Wantto' %}footer-nav-li-select{% endif %}">
                        <a class="footer-nav-a" href="{% url 'tabisync:Wantto' pk=itinerary.pk token=itinerary.token %}">
                            <i class="fa-solid fa-map-location-dot"></i>
                            <!--<div>地図</div>-->
                        </a>
                    </li>
                    <li class="footer-nav-li {% if request.resolver_match.url_name == 'content_edit_v2' %}footer-nav-li-select{% endif %}">
                        <a class="footer-nav-a" href="{% url 'tabisync:content_edit_v2' pk=itinerary.pk token=itinerary.token %}">
                            <i class="fa-regular fa-pen-to-square"></i>
                            <!--<div>編集</div>-->
                        </a>
                    </li>
                    <li class="footer-nav-li {% if request.resolver_match.url_name == 'content_edit_v2' %}footer-nav-li-select{% endif %}">
                        <a class="footer-nav-a" href="{% url 'tabisync:content_edit_v2' pk=itinerary.pk token=itinerary.token %}">
                            <img src="{% static 'img/ai-concierge-icon.webp' %}" alt="AIコンシェルジュ" class="footer-nav-icon-ai-concierge">
                            <!--<div>編集</div>-->
                        </a>
                    </li>
          
                </ul>
            </nav>
            <ul>
                <li><a class="footer-content" href="{% url 'tabisync:user_agreement' %}">利用規約</a></li>
                <li><a class="footer-content" href="{% url 'tabisync:privacy_policy' %}">プライバシーポリシー</a></li>
                <li><a class="footer-content" href="{% url 'tabisync:profile' %}">運営者プロフィール</a></li>
            </ul>
            <small>Copyright &copy; 2026 TabiSync All Rights Reserved.</small>
        </footer>
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const toggle = document.querySelector(".content-side-nav-toggle");
                const storageKey = "tabisync_content_side_nav_collapsed";
                const collapsedClass = "is-side-nav-collapsed";

                function applySideNavState(isCollapsed) {
                    document.body.classList.toggle(collapsedClass, isCollapsed);
                    if (!toggle) return;

                    toggle.setAttribute("aria-expanded", isCollapsed ? "false" : "true");
                    toggle.setAttribute("aria-label", isCollapsed ? "サイドバーを開く" : "サイドバーを折りたたむ");

                    const icon = toggle.querySelector("i");
                    if (icon) {
                        icon.className = isCollapsed ? "fa-solid fa-angle-right" : "fa-solid fa-angle-left";
                    }
                }

                applySideNavState(window.localStorage.getItem(storageKey) === "true");

                if (toggle) {
                    toggle.addEventListener("click", function () {
                        const nextState = !document.body.classList.contains(collapsedClass);
                        window.localStorage.setItem(storageKey, String(nextState));
                        applySideNavState(nextState);
                    });
                }
            });
        </script>
    </body>
</html>
