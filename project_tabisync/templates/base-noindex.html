{% load static %}
<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>TabiSync | 旅のしおりを簡単共有！</title>
        <!-- インデックス防止用-->
        <meta name="robots" content="noindex, nofollow">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Font Awesome CDN (最新版) -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <!-- ファビコン -->
        <link rel="icon" href="{% static 'img/icon-tabisync.webp'%}">
        <link rel="apple-touch-icon" href="{% static 'img/icon-tabisync.webp'%}">
        <!-- iPhone用のアイコンサイズを指定 -->
        <meta name="apple-mobile-web-app-title" content="TabiSync">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <!-- OGP設定 -->
        <meta property="og:title" content="TabiSync">
        <meta property="og:description" content="旅のしおりをみんなで簡単共有！">
        <meta property="og:image" content="{{ request.build_absolute_uri|cut:request.get_full_path }}{% static 'img/tabisync-ogp.webp' %}">
        <meta property="og:url" content="{{ request.build_absolute_uri }}">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="TabiSync">
        <!-- Twitterカード（任意）-->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="TabiSync">
        <meta name="twitter:description" content="旅のしおりをみんなで簡単共有！">
        <meta name="twitter:image" content="{{ request.build_absolute_uri|cut:request.get_full_path }}{% static 'img/tabisync-ogp.webp' %}">
        <!---Googleフォント-->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
        <!---リセットcsss-->
        <link rel="stylesheet" href="{% static 'css/reset.css'%}">
        <!--オリジナルCSS-->
        <link rel="stylesheet" href="{% static 'css/style.css'%}">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">    
        <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    </head>
    <body>
        <div class="pc-body-wrapper">
        <header class="page-header">
            <div class="header-wrapper">
                <div class="header-logo">
                    <p class="header-logo-text">
                        <a href="{% url 'tabisync:home' %}">
                            <img src="{% static 'img/logo-tabisync.png' %}" alt="TabiSync" class="logo-image">
                        </a>
                    </p>
                </div>
                <!-- ハンバーガーアイコン -->
                <div id="btn08" class="btn-trigger">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <nav class="header-nav-wrapper" id="nav-menu">

                        <li class="header-nav-item"><a href="{% url 'tabisync:home' %}">ホーム</a></li>
                        <li class="header-nav-item"><a href="https://blog.tabisync.com" target="_blank" rel="noopener noreferrer">ブログ</a></li>
                        <li class="header-nav-item"><a href="{% url 'tabisync:create' %}">しおり作成</a></li>
                        <li class="header-nav-item"><a href="{% url 'tabisync:demo_v2_content' %}">しおりサンプル</a></li>
                        <li class="header-nav-item"><a href="{% url 'tabisync:qa' %}">よくある質問</a></li>
                        <li class="header-nav-item"><a href="{% url 'tabisync:contact' %}">お問い合わせ</a></li>
                    </ul>
                </nav>
                <nav class="header-nav-pc-wrapper">
                    <ul class="header-nav-pc">
                        <li class="header-nav-pc-item"><a href="{% url 'tabisync:home' %}">HOME</a></li>
                        <li class="header-nav-pc-item"><a href="{% url 'tabisync:demo_v2_content' %}">DEMO</a></li>
                        <li class="header-nav-pc-item"><a href="{% url 'tabisync:qa' %}"> FAQ</a></li>
                        <li class="header-nav-pc-item"><a href="https://blog.tabisync.com" target="_blank" rel="noopener noreferrer">BLOG</a></li>
                        <li class="header-nav-pc-item"><a href="{% url 'tabisync:contact' %}">CONTACT</a></li>
                    </ul>
                    <a class="header-social-link" href="https://x.com/tabisync_com" target="_blank" rel="noopener noreferrer" aria-label="TabiSync公式X（旧Twitter）">
                        <i class="fa-brands fa-x-twitter" aria-hidden="true"></i>
                    </a>
                </nav>
            </div>
        </header>

        {% block contents %}

        <footer>
            <ul class="footer-social" aria-label="公式SNS">
                <li>
                    <a class="footer-social-link" href="https://x.com/tabisync_com" target="_blank" rel="noopener noreferrer" aria-label="TabiSync公式X（旧Twitter）">

            <ul>

            </ul>
            <small>Copyright &copy; 2025 TabiSync All Rights Reserved.</small>

    </div>
        <script src="{% static 'js/menu.js' %}"></script>

</html>
