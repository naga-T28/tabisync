        <style>
            /* Box sizing rules */
            *,
            *::before,
            *::after {

            body,
            h1,
            h2,
            h3,
            h4,
            p,
            figure,
            blockquote,
            dl,
            dd {

            }

            ul[role="list"],

            }

            html:focus-within {

            }

            body {

            }

            a:not([class]) {

            img,

            }

            input,
            button,
            textarea,
            select {
                font: inherit;
            }

            @media (prefers-reduced-motion: reduce) {
                html:focus-within {
                scroll-behavior: auto;
                }
                *,
                *::before,
                *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
