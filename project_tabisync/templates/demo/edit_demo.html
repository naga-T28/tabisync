{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TabiSync - デモページ</title>
    <!-- インデックス防止用-->
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Font Awesome CDN (最新版) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- ファビコン -->
    <link rel="icon" href="{% static 'img/icon-tabisync.png'%}">
    <link rel="apple-touch-icon" href="{% static 'img/icon-tabisync.png'%}">
    <!-- iPhone用のアイコンサイズを指定 -->
    <meta name="apple-mobile-web-app-title" content="TabiSync">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Googleフォント -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&display=swap" rel="stylesheet">
    <!-- リセットCSS -->
    <link rel="stylesheet" href="{% static 'css/reset.css'%}">
    <!-- オリジナルCSS -->
    <link rel="stylesheet" href="{% static 'css/style2.css'%}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</head>
<body id="content-body">
    <header class="page-header">
        <div class="header-wrapper">
            <div class="header-logo">
                <h1>
                    <a href="{% url 'tabisync:home' %}">
                        <img src="{% static 'img/logo-tabisync.png' %}" alt="TabiSyncロゴ" class="logo-image">
                    </a>
                </h1>
            </div>
            <!-- ハンバーガーアイコン -->
            <div id="btn08" class="btn-trigger">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <nav class="header-nav-wrapper" id="nav-menu">
                <ul class="header-nav">
                    <li class="header-nav-item"><a href="{% url 'tabisync:user_agreement' %}">利用規約</a></li>
                    <li class="header-nav-item"><a href="{% url 'tabisync:privacy_policy' %}">プライバシーポリシー</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="content-main">
        <div class="main-wrapper main-wrapper-demo">
            <div class="box5-6 box-demo">
                <h2 class="box-title">デモ</h2>
                <div class="box-content-demo">
                    <p>これはデモの為、編集は出来ません<br>早速しおりを作ってみましょう！</p>
                    <a class="about-tabisync-btn" href="{% url 'tabisync:create' %}"><i class="fa-solid fa-pen-to-square"></i> しおりを作成する</a>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <nav class="footer-nav">
            <ul class="footer-nav-ul">
                <li class="footer-nav-li"><a class="footer-nav-a" href="{% url 'tabisync:demo_content' %}"><i class="fa-solid fa-house"></i><div>旅程表</div></a></li>
                <li class="footer-nav-li"><a class="footer-nav-a" href="{% url 'tabisync:demo_list' %}"><i class="fa-solid fa-list-check"></i><div>リスト</div></a></li>
                <li class="footer-nav-li"><a class="footer-nav-a" href="{% url 'tabisync:demo_memo' %}"><i class="fa-solid fa-clipboard"></i><div>メモ</div></a></li>
                <li class="footer-nav-li footer-nav-li-select"><a class="footer-nav-a" href="{% url 'tabisync:demo_edit' %}"><i class="fa-solid fa-file-pen"></i><div>編集</div></a></li>
            </ul>
        </nav>
        <ul>
            <li><a class="footer-content" href="{% url 'tabisync:user_agreement' %}">利用規約</a></li>
            <li><a class="footer-content" href="{% url 'tabisync:privacy_policy' %}">プライバシーポリシー</a></li>
        </ul>
        <small>Copyright &copy; 2024-2025 TabiSync All Rights Reserved.</small>
    </footer>

    <script src="{% static 'js/menu.js' %}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const sections = Array.from(document.querySelectorAll(".date-section"));
            const label = document.getElementById("current-date-label");
            let currentIndex = 0;

            function showSection(index) {
                sections.forEach((s, i) => s.style.display = i === index ? "block" : "none");
                label.textContent = `Day ${index + 1}`;
            }

            document.getElementById("prev-date").addEventListener("click", () => {
                currentIndex = (currentIndex - 1 + sections.length) % sections.length;
                showSection(currentIndex);
            });

            document.getElementById("next-date").addEventListener("click", () => {
                currentIndex = (currentIndex + 1) % sections.length;
                showSection(currentIndex);
            });

            // 初期表示
            if (sections.length > 0) showSection(0);
        });

        // ハンバーガーメニューのトグル例（もとのJSと合わせて調整してください）
        document.getElementById("btn08").addEventListener("click", function () {
            const nav = document.getElementById("nav-menu");
            nav.classList.toggle("open");
            this.classList.toggle("open");
        });
    </script>
</body>
</html>
