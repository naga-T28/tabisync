{% extends "demo/v2_base.html" %}
{% block title %}沖縄旅行編集デモ{% endblock %}

{% block contents %}
<main class="content-main">
    <div class="edit-menu">
        <h2 class="edit-menu-title">しおり内容の編集</h2>
        <p class="edit-menu-description">デモページのため保存はできませんが、現在の編集メニューと同じ見た目で確認できます。</p>
        <div class="edit-menu-buttons">
            <a class="edit-menu-button" href="{% url 'tabisync:create' %}">
                <i class="fa-solid fa-pen-to-square"></i>
                <div class="edit-menu-text">
                    <p class="edit-menu-text-title">内容編集</p>
                    <p class="edit-menu-text-description">タイトル、サブタイトル、旅行日数の変更、概要が編集できます</p>
                </div>
                <p>〉</p>
            </a>
            <a class="edit-menu-button" href="{% url 'tabisync:demo_v2_content' %}">
                <i class="fa-solid fa-calendar-days"></i>
                <div class="edit-menu-text">
                    <p class="edit-menu-text-title">旅程表編集</p>
                    <p class="edit-menu-text-description">予定を追加・削除・編集することができます</p>
                </div>
                <p>〉</p>
            </a>
        </div>
    </div>
</main>
{% endblock %}
