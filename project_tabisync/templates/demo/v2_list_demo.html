{% extends "demo/v2_base.html" %}
{% block title %}沖縄旅行リストデモ{% endblock %}

{% block contents %}
<div class="content-main checklist-ios-main">
  <div class="checklist-view-page checklist-ios-shell" data-can-edit="false">
    <header class="checklist-ios-header">
      <div>
        <p class="checklist-ios-trip">沖縄旅行</p>
        <h1>リマインダー</h1>
      </div>
      <p id="checklist-status" class="checklist-status checklist-ios-status" data-status="idle">
        <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
        <span>閲覧中</span>
      </p>
    </header>
    <section id="checklistBoard" class="checklist-board checklist-ios-board"></section>
  </div>
</div>

<script id="checklists-data" type="application/json">
[
  {
    "id": "list-pack",
    "title": "持ち物",
    "items": [
      {"id": "item-swim", "text": "水着", "checked": true},
      {"id": "item-sandal", "text": "サンダル", "checked": true},
      {"id": "item-sunscreen", "text": "日焼け止め", "checked": false},
      {"id": "item-battery", "text": "モバイルバッテリー", "checked": false}
    ]
  },
  {
    "id": "list-buy",
    "title": "お土産",
    "items": [
      {"id": "item-tart", "text": "紅いもタルト", "checked": false},
      {"id": "item-chinsuko", "text": "ちんすこう", "checked": true},
      {"id": "item-glass", "text": "琉球ガラスの小物", "checked": false}
    ]
  },
  {
    "id": "list-kids",
    "title": "子ども用",
    "items": [
      {"id": "item-change", "text": "着替えを多めに", "checked": false},
      {"id": "item-snack", "text": "移動中のおやつ", "checked": false},
      {"id": "item-cap", "text": "帽子", "checked": true}
    ]
  }
]
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const board = document.getElementById("checklistBoard");
  const dataEl = document.getElementById("checklists-data");
  const lists = JSON.parse(dataEl.textContent || "[]");
  let activeListId = lists[0]?.id || "";

  function escapeHtml(text) {
    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function getActiveList() {
    return lists.find((list) => list.id === activeListId) || lists[0] || null;
  }

  function renderListTabs(activeList) {
    return `
      <nav class="checklist-tabs checklist-ios-tabs" aria-label="リスト切り替え">
        ${lists.map((list) => `
          <button type="button" class="checklist-tab checklist-ios-tab ${activeList && list.id === activeList.id ? "is-active" : ""}" data-action="select-list" data-list-id="${list.id}">
            ${escapeHtml(list.title || "リスト")}
          </button>
        `).join("")}
      </nav>
    `;
  }

  function renderBoard() {
    if (!lists.length) {
      board.innerHTML = `
        <div class="checklist-empty checklist-ios-empty">
          <i class="fa-regular fa-circle-check" aria-hidden="true"></i>
          <p>表示できるリストがありません。</p>
        </div>
      `;
      return;
    }

    const activeList = getActiveList();
    const items = activeList.items || [];
    const remainingCount = items.filter((item) => !item.checked).length;

    board.innerHTML = `
      ${renderListTabs(activeList)}
      <article class="checklist-card checklist-ios-card" data-list-id="${activeList.id}">
        <div class="checklist-ios-card-header">
          <h2 class="checklist-title-input checklist-ios-title-input">${escapeHtml(activeList.title || "リスト")}</h2>
          <span>${remainingCount}件</span>
        </div>
        <ul class="checklist-items checklist-ios-items">
          ${items.length ? items.map((item) => `
            <li class="checklist-item checklist-ios-item ${item.checked ? "is-checked" : ""}">
              <label class="checklist-label checklist-ios-label">
                <input type="checkbox" ${item.checked ? "checked" : ""} disabled aria-label="${escapeHtml(item.text || "項目")}">
                <span class="checklist-ios-ring" aria-hidden="true"></span>
              </label>
              <span class="checklist-item-input checklist-ios-item-input">${escapeHtml(item.text || "項目")}</span>
            </li>
          `).join("") : `<li class="checklist-empty-text checklist-ios-empty-row">このリストには項目がありません。</li>`}
        </ul>
      </article>
    `;
  }

  board.addEventListener("click", function (event) {
    const actionButton = event.target.closest("[data-action='select-list']");
    if (!actionButton) return;
    activeListId = actionButton.dataset.listId || activeListId;
    renderBoard();
  });

  renderBoard();
});
</script>
{% endblock %}
