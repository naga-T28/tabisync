{% extends "demo/v2_base.html" %}
{% block title %}沖縄旅行リストデモ{% endblock %}

{% block contents %}
<div class="content-main">
  <div class="checklist-view-page">
    <div class="title-wrapper">
      <div class="title-visual --miniMargin">
        <p class="siori-sub-title">沖縄旅行</p>
        <h1 class="siori-title --noMargin">みんなのチェックリスト</h1>
      </div>
    </div>

    <section class="checklist-header">
      <div>
        <h2>チェックリスト一覧</h2>
        <p>旅行前に必要な持ち物や買い物リストを、複数のカードで整理できます。</p>
      </div>
    </section>

    <section class="checklist-board">
      <article class="checklist-card">
        <div class="box5-6 checklist-box">
          <h3 class="checklist-tape checklist-tape-0">持ち物リスト</h3>
          <div class="box-content">
            <ul class="checklist-items">
              <li class="checklist-item"><label class="checklist-label"><input type="checkbox" checked disabled><span>水着</span></label></li>
              <li class="checklist-item"><label class="checklist-label"><input type="checkbox" checked disabled><span>サンダル</span></label></li>
              <li class="checklist-item"><label class="checklist-label"><input type="checkbox" disabled><span>ラッシュガード</span></label></li>
              <li class="checklist-item"><label class="checklist-label"><input type="checkbox" disabled><span>モバイルバッテリー</span></label></li>
            </ul>
          </div>
        </div>
      </article>

      <article class="checklist-card">
        <div class="box5-6 checklist-box">
          <h3 class="checklist-tape checklist-tape-1">買って帰るもの</h3>
          <div class="box-content">
            <ul class="checklist-items">
              <li class="checklist-item"><label class="checklist-label"><input type="checkbox" disabled><span>紅いもタルト</span></label></li>
              <li class="checklist-item"><label class="checklist-label"><input type="checkbox" disabled><span>シーサーの置物</span></label></li>
              <li class="checklist-item"><label class="checklist-label"><input type="checkbox" checked disabled><span>沖縄限定のお菓子</span></label></li>
            </ul>
          </div>
        </div>
      </article>
    </section>
  </div>
</div>
{% endblock %}
