{% load static %}
<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>{% block title %}TabiSync | ログインなしで友達と旅行を決められるAIしおり{% endblock %}</title>
        <meta name="description" content="{% block meta_description %}TabiSyncは、ログインなしで旅程・行きたい場所・持ち物をURL共有できるAIしおりです。AIコンシェルジュが、みんなの候補をもとに旅行計画の相談や調整をサポートします。{% endblock %}">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="google-adsense-account" content="ca-pub-2974880632446425">
        <meta name="robots" content="{% block robots_meta %}index, follow{% endblock %}">
        <link rel="canonical" href="{% block canonical_url %}{{ public_base_url }}{{ request.path }}{% endblock %}">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
        <link rel="icon" href="{% static 'img/icon-pc.webp'%}">
        <link rel="apple-touch-icon" href="{% static 'img/tabisync-ios-icon.ico'%}">
        <meta name="apple-mobile-web-app-title" content="TabiSync">
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
        <meta property="og:title" content="{% block og_title %}TabiSync{% endblock %}">
        <meta property="og:description" content="{% block og_description %}ログインなしで、友達とその場で旅行を決められるAIしおり。URLを送るだけで旅程・行きたい場所・持ち物を共有できます。{% endblock %}">
        <meta property="og:image" content="{% block og_image %}{{ public_base_url }}{% static 'img/tabisync-v2-ogp.webp' %}{% endblock %}">
        <meta property="og:image:width" content="1200">
        <meta property="og:image:height" content="630">
        <meta property="og:image:alt" content="{% block og_image_alt %}TabiSyncのサービスイメージ{% endblock %}">
        <meta property="og:url" content="{% block og_url %}{{ public_base_url }}{{ request.path }}{% endblock %}">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="TabiSync">
        <meta property="og:locale" content="ja_JP">
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="{% block twitter_title %}TabiSync{% endblock %}">
        <meta name="twitter:description" content="{% block twitter_description %}ログインなしで、友達とその場で旅行を決められるAIしおり。URLを送るだけで旅程・行きたい場所・持ち物を共有できます。{% endblock %}">
        <meta name="twitter:image" content="{% block twitter_image %}{{ public_base_url }}{% static 'img/tabisync-v2-ogp.webp' %}{% endblock %}">
        {% block meta_extra %}{% endblock %}
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600;700&display=swap">
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{% static 'css/home.css' %}">
        <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2974880632446425"
     crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="pc-body-wrapper">
            <header class="page-header">
                <div class="header-wrapper">
                    <div class="header-logo">
                        <p class="header-logo-text">
                            <a href="{% url 'tabisync:home' %}">
                                <img src="{% static 'img/tabisync-logo-white.webp' %}" alt="TabiSync" class="logo-image">
                            </a>
                        </p>
                    </div>
                    <div id="btn08" class="btn-trigger" aria-label="メニューを開く" role="button" tabindex="0">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <nav class="header-nav-wrapper" id="nav-menu">
                        <ul class="header-nav">
                            <li class="header-nav-item"><a href="{% url 'tabisync:home' %}">ホーム</a></li>
                            <li class="header-nav-item"><a href="https://blog.tabisync.com" target="_blank" rel="noopener noreferrer">ブログ</a></li>
                            <li class="header-nav-item"><a href="{% url 'tabisync:create' %}">しおり作成</a></li>
                            <li class="header-nav-item"><a href="{% url 'tabisync:demo_v2_content' %}">しおりサンプル</a></li>
                            <li class="header-nav-item"><a href="{% url 'tabisync:qa' %}">よくある質問</a></li>
                            <li class="header-nav-item"><a href="{% url 'tabisync:contact' %}">お問い合わせ</a></li>
                        </ul>
                    </nav>

                    <nav class="header-nav-pc-wrapper">
                        <ul class="header-nav-pc">
                            <li class="header-nav-pc-item"><a href="{% url 'tabisync:home' %}">HOME</a></li>
                            <li class="header-nav-pc-item"><a href="{% url 'tabisync:demo_v2_content' %}">DEMO</a></li>
                            <li class="header-nav-pc-item"><a href="{% url 'tabisync:qa' %}">FAQ</a></li>
                            <li class="header-nav-pc-item"><a href="https://blog.tabisync.com" target="_blank" rel="noopener noreferrer">BLOG</a></li>
                            <li class="header-nav-pc-item"><a href="{% url 'tabisync:contact' %}">CONTACT</a></li>
                        </ul>
                        <a class="header-social-link" href="https://x.com/tabisync_com" target="_blank" rel="noopener noreferrer" aria-label="TabiSync公式X（旧Twitter）">
                            <i class="fa-brands fa-x-twitter" aria-hidden="true"></i>
                        </a>
                    </nav>
                </div>
            </header>

            {% block contents %}{% endblock %}

            {% include "_site_footer.html" %}
        </div>
        <script>
        (function () {
            const header = document.querySelector(".page-header");
            const btn = document.getElementById("btn08");
            const nav = document.getElementById("nav-menu");

            function syncHeaderBackground() {
                if (!header) return;
                header.classList.toggle("is-scrolled", window.scrollY >= 80);
            }

            syncHeaderBackground();
            window.addEventListener("scroll", syncHeaderBackground, { passive: true });

            if (!btn || !nav) return;

            function toggleMenu() {
                btn.classList.toggle("active");
                nav.classList.toggle("active");
            }

            btn.addEventListener("click", toggleMenu);
            btn.addEventListener("keydown", function (event) {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    toggleMenu();
                }
            });
        })();
        </script>
    </body>
</html>
