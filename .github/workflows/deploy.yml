name: Deploy to VPS

on:
  push:
    branches:
      - main
      - test

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Determine deploy target directory
        id: set-dir
        run: |
          if [[ "${GITHUB_REF##*/}" == "main" ]]; then
            echo "dir=prod" >> "$GITHUB_OUTPUT"
            echo "compose_path=/home/${{ secrets.VPS_USER }}/tabisync/prod/docker-compose.yml" >> "$GITHUB_OUTPUT"
          else
            echo "dir=staging" >> "$GITHUB_OUTPUT"
            echo "compose_path=/home/${{ secrets.VPS_USER }}/tabisync/staging/docker-compose-staging.yml" >> "$GITHUB_OUTPUT"
          fi

      - name: Rsync to VPS
        run: |
          rsync -avz --no-perms --no-owner --no-group --exclude='.env' ./ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/home/${{ secrets.VPS_USER }}/tabisync/${{ steps.set-dir.outputs.dir }}/

      - name: Run docker-compose on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << EOF
            cd /home/${{ secrets.VPS_USER }}/tabisync/${{ steps.set-dir.outputs.dir }}

            # up -d --build のみを実行し、down は行わない。
            # down するとこのプロジェクトが作る prod_tabisync/staging_tabisync
            # ネットワークが再作成され、~/web_app 側の web（Nginx、他サイトも
            # 同居する共有リバースプロキシ）がそのネットワークに external 接続
            # しているため接続が切れてしまう。web には一切触れない。
            docker compose -f ${{ steps.set-dir.outputs.compose_path }} up -d --build
          EOF
